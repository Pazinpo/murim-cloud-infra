name: Deploy to AWS EC2
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "murim-cloud-practice-project" ]; then
              git clone https://github.com/Pazinpo/murim-cloud-practice-project.git
            fi
            cd ~/murim-cloud-practice-project
            git pull origin main
            # .env 는 저장소에 없습니다(.gitignore). 서버 최초 구성 시 Terraform user_data 가
            # 변수 값으로 생성하며, 형식은 .env.example 을 참고하세요.
            if [ ! -f ".env" ]; then
              echo "ERROR: .env 파일이 없습니다. .env.example 을 참고해 서버에 생성하세요."
              exit 1
            fi
            docker compose pull
            docker compose up -d
            echo "CI/CD 완료!!"
